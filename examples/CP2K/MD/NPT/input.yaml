# ============================================================
# SPARC - CP2K NPT (Isothermal-Isobaric) Ensemble
# Ammonia Borane (NH3BH3), PBE-D3/DZVP-MOLOPT
# ============================================================
# NPT: constant Number, Pressure, Temperature.
# Cell volume fluctuates. Uses Berendsen barostat (ASE NPTBerendsen).

general:
  structure_file: "../../../AmmoniaBorate.xyz"

dft_calculator:
  engine: "CP2K"
  template_file: "cp2k_template.inp"
  exe_command: "mpirun -np 2 /home/prg/Softwares/cp2k_gcc/exe/local/cp2k_shell.psmp"

cp2k:
    xc: 'PADE'
    basis_set_file: 'BASIS_MOLOPT'
    potential_file: 'GTH_POTENTIALS'

aimd_setup:
  ensemble: "NPT"
  temperature: 300                      # Target temperature [K]
  pressure: 10000.0                         # Target pressure (bar)
  tau_t: 10                             # Berendsen temperature coupling time [fs]
  tau_p: 50                             # Berendsen pressure coupling time [fs]
 # compressibility: 0.00001              # Isothermal compressibility [Ang^3/eV] (~water)
  thermostat:
    type: "Langevin"
    friction: 0.10
  timestep_fs: 0.5
  steps: 500
  log_frequency: 1
  restart: false
  plumed:
    enabled: false

output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
