# ============================================================
# SPARC - CP2K NVE (Microcanonical) Ensemble
# Ammonia Borane (NH3BH3), PBE-D3/DZVP-MOLOPT
# ============================================================
# NVE: constant Number, Volume, Energy. No thermostat.
# Run from this directory:
#   python /path/to/sparc.py -i input.yaml

general:
  structure_file: "../../../AmmoniaBorate.xyz"

dft_calculator:
  engine: "CP2K"
  template_file: "cp2k_template.inp"
  exe_command: "mpirun -np 2 /home/prg/Softwares/cp2k_gcc/exe/local/cp2k_shell.psmp"

cp2k:
    xc: 'PADE'
    basis_set_file: 'BASIS_MOLOPT'
    potential_file: 'GTH_POTENTIALS'

aimd_setup:
  ensemble: "NVE"
  temperature: 300                      # Initial Maxwell-Boltzmann velocity assignment
  timestep_fs: 0.5
  steps: 100
  log_frequency: 1
  restart: false
  plumed:
    enabled: false

output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
