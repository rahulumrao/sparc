# ============================================================
# SPARC Full Workflow - CP2K + DeepMD Active Learning
# Ammonia Borane (NH3BH3) Test Case
# ============================================================
# Full pipeline:
#   1. AIMD warm-up with CP2K (ab initio MD)
#   2. DeepMD model training on AIMD data
#   3. ML/MD exploration with trained models
#   4. Active learning: Query-By-Committee selects uncertain frames
#   5. CP2K labels selected frames (DFT single-points)
#   6. Retrain and iterate
#

general:
  structure_file: "AmmoniaBorate.xyz"

# -------------------------------------------------------
# DFT Calculator (CP2K via ASE)
# -------------------------------------------------------
dft_calculator:
  engine: "CP2K"
  template_file: "cp2k_template.inp"
  exe_command: "mpirun -np 2 /home/prg/Softwares/cp2k_gcc/exe/local/cp2k_shell.psmp"

cp2k:
    xc: 'PADE'
    basis_set_file: 'BASIS_MOLOPT'
    potential_file: 'GTH_POTENTIALS'

# -------------------------------------------------------
# AIMD Setup (ab initio warm-up + labelling)
# -------------------------------------------------------
aimd_setup:
  ensemble: "NVT"
  temperature: 300                     # [K]
  thermostat:
    type: "Langevin"
    friction: 0.10
  timestep_fs: 1.0
  steps: 500                           # Short AIMD warm-up; increase for production
  log_frequency: 2
  restart: false
  plumed:
    enabled: false

# -------------------------------------------------------
# DeepMD (MLIP) Setup
# -------------------------------------------------------
mlip_setup:
  training: true                       # Train DeepMD model
  data_dir: "DeePMD_training/00.data"
  input_file: "input.json"
  skip_min: 10
  skip_max: null
  num_models: 3                        # Committee size for QbC
  MdSimulation: true                   # Run ML/MD exploration
  restart: false
  ensemble: "NVT"
  temperature: 350.0
  thermostat:
    type: "Nose"
    tdamp: 25.0
  timestep_fs: 1.0
  md_steps: 5000
  multiple_run: 2
  log_frequency: 20
  plumed:
    enabled: false

# -------------------------------------------------------
# Active Learning
# -------------------------------------------------------
active_learning: true
learning_restart: false
iteration: 4                           # Total AL iterations
model_dev:
  f_min_dev: 0.10                      # Below threshold: trusted frame
  f_max_dev: 0.35                      # Above threshold: too uncertain, discard

# -------------------------------------------------------
# Distance / Structural Safety Checks
# -------------------------------------------------------
distance_metrics:
  - pair: [0, 7]                       # B-N bond
    min_distance: 1.0
    max_distance: 6.0
  - pair: [0, 6]                       # B-H bond
    min_distance: 0.8
    max_distance: 2.0
  - pair: [7, 2]                       # N-H bond
    min_distance: 0.8
    max_distance: 2.0

# -------------------------------------------------------
# Output
# -------------------------------------------------------
output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
