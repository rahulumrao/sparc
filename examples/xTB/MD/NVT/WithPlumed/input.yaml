# ============================================================
# SPARC - xTB Example (Ammonia Borane, NH3BH3)
# ============================================================
# xTB (GFN2-xTB) semiempirical tight-binding — very fast.
# Ideal for: large systems, prototyping, pre-equilibration runs.

general:
  structure_file: "AmmoniaBorate.xyz"

dft_calculator:
  engine: "xTB"
  template_file: "xtb_template.inp"
  exe_command: "OMP_NUM_THREADS=2 /home/rverma7/anaconda3/envs/sparcGNN/bin/xtb"   # Or full path: /path/to/xtb

aimd_setup:
  ensemble: "NVT"
  temperature: 300
  thermostat:
    type: "Nose"
    tdamp: 25
  timestep_fs: 1.0
  steps: 50000
  log_frequency: 20
  restart: false
  plumed:
    enabled: true
    plumed_file: "plumed.dat"

output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
