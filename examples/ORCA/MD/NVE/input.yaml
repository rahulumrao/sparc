# ============================================================
# SPARC - ORCA NVE (Microcanonical) Ensemble
# Ammonia Borane (NH3BH3), r2SCAN-3c (non-periodic)
# ============================================================
# NVE: constant Number, Volume, Energy. No thermostat.
# ORCA is molecular (non-periodic) — no cell definition needed.

general:
  structure_file: "../../../AmmoniaBorate.xyz"

dft_calculator:
  engine: "ORCA"
  template_file: "orca_template.inp"
  exe_command: "/home/rverma7/Softwares/ORCA/orca"         # Full path to ORCA binary required

aimd_setup:
  ensemble: "NVE"
  temperature: 300                     # Initial velocity assignment [K]
  timestep_fs: 0.5
  steps: 100
  log_frequency: 1
  restart: false
  plumed:
    enabled: false

output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
