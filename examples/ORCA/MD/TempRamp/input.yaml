# ============================================================
# SPARC - ORCA Temperature Ramp (NVT, linear heating)
# Ammonia Borane (NH3BH3), r2SCAN-3c (non-periodic)
# ============================================================
# Linearly ramps temperature from temp_start to temp_end over all steps.
# Only supported with NVT ensemble.

general:
  structure_file: "../../../AmmoniaBorate.xyz"

dft_calculator:
  engine: "ORCA"
  template_file: "orca_template.inp"
  exe_command: "/home/rverma7/Softwares/ORCA/orca"

aimd_setup:
  ensemble: "NVT"
  temperature: 100                     # temp_start [K]
  temp_start: 100                      # Ramp start [K]
  temp_end: 500                        # Ramp end [K]
  thermostat:
    type: "Langevin"
    friction: 0.10
  timestep_fs: 0.5
  steps: 1000
  log_frequency: 1
  restart: false
  plumed:
    enabled: false

output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
