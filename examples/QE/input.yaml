# ============================================================
# SPARC - Quantum ESPRESSO Example (Ammonia Borane, NH3BH3)
# ============================================================
# Requires: pseudopotential UPF files in ./pseudo/ directory.
# Download from: https://www.pseudo-dojo.org or SSSP library.
# Run from this directory:
#   python /path/to/sparc.py -i input.yaml

general:
  structure_file: ["AmmoniaBorate.xyz"]

dft_calculator:
  engine: "QE"
  template_file: "qe_template.inp"
  exe_command: "mpirun -np 4 pw.x"     # Adjust MPI and pw.x path

aimd_setup:
  ensemble: "NVT"
  temperature: 300
  thermostat:
    type: "Langevin"
    friction: 0.10
  timestep_fs: 1.0
  steps: 100
  log_frequency: 1
  restart: false
  plumed:
    enabled: false

output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
