# ============================================================
# SPARC - VASP Example (Ammonia Borane, NH3BH3)
# ============================================================
# VASP requires pseudopotential POTCARs for each element (B, N, H).
# Ensure POTCAR files are available and VASP is licensed.
# Run from this directory:
#   python /path/to/sparc.py -i input.yaml

general:
  structure_file: "AmmoniaBorate.xyz"

dft_calculator:
  engine: "VASP"
  template_file: "INCAR"               # VASP INCAR parameter file
  exe_command: "mpirun -np 4 vasp_std" # Adjust to your VASP binary and MPI setup

aimd_setup:
  ensemble: "NVT"
  temperature: 300
  thermostat:
    type: "Langevin"
    friction: 0.10
  timestep_fs: 1.0
  steps: 100
  log_frequency: 1
  restart: false
  plumed:
    enabled: true
    plumed_file: plumed.dat
    kT: 0.02585      # eV at 300 K
    restart: false
    force_correction:
      enabled: true           # set true when running biased AIMD
      cv_force_file: cv_force  # matches FILE= in DUMPFORCES
      cv_derivs_file: cv_derivs  # matches FILE= in DUMPDERIVATIVES
      cv_atoms:
        - [1, 8]               # d1: DISTANCE ATOMS=1,8

output:
  log_file: "AseMD.log"
  xyz_file: "AseTraj.xyz"
  aimdtraj_file: "AseMD.traj"
  dptraj_file: "dpmd.traj"
