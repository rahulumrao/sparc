name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check sparc/

      - name: Ruff format check
        run: ruff format --check sparc/

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          environment-name: ci
          create-args: >-
            python=3.10
            py-plumed
            pip
          cache-environment: true

      - name: Install SPARC and run tests
        shell: micromamba-shell {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install deepmd-kit[torch]
          pip install -e .
          pytest -q
